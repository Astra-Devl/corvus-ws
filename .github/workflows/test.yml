name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test hasil build (CJS + ESM)
        run: |
          node -e "const m = require('./dist/cjs/src/index.js'); if (typeof m.makeSocket !== 'function') process.exit(1)"
          node --input-type=module -e "const m = await import('./dist/esm/src/index.js'); if (typeof m.makeSocket !== 'function') process.exit(1)"
