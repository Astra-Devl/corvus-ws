name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # provenance npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Pastikan tag rilis sama dengan versi di package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag ($GITHUB_REF_NAME) tidak sama dengan versi package.json ($VERSION)" >&2
            exit 1
          fi
      # `prepublishOnly` menjalankan `npm run check` dan `npm run build` otomatis.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
